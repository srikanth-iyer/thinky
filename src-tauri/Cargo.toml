[package]
name = "lean-outliner"
version = "0.1.0"
edition = "2021"

[lib]
name = "lean_outliner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"
outline_core = { path = "../core" }

# file-change notifications (inotify); already part of the build through Tauri, so no extra size
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"
