# The thinky core built for a web browser (WebAssembly). A test, not part of the app.
[package]
name = "thinky_web"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib"]   # a .wasm file the browser loads

[dependencies]
outline_core = { path = "../../core" }
serde_json = "1"

[profile.release]
opt-level = "s"     # small over fast, as the app's own build
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]   # its own: not built with the app
