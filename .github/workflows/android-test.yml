# Runs the Android app on an emulator and drives it: file-access prompt, opening a sample
# vault, editing, the share-to-journal pop-up. Triggered by "[android-test]" in a commit
# message (or by hand). Screenshots + log are force-pushed to the android-test-results branch.
name: android-test

permissions:
  contents: read

on:
  push:
    branches: [main, 'wip/**']
  workflow_dispatch:

jobs:
  emulator:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android-test]')
    # a newer phone test of the same branch stops the older one (saves build minutes); set on the job,
    # so a push that doesn't ask for a phone test (the job is skipped) never stops one that's running
    concurrency:
      group: android-test-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '17' }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: 'x86_64-linux-android' }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: android-test }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts # (only the Tauri command line, which needs no install scripts)
      - run: cargo fetch --locked # (the crates exactly as Cargo.lock lists them; a stale lock file stops the build)
      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: npx tauri android init --ci
      - run: python3 scripts/android_overlay.py
      # debug build: same code, plus WebView debugging so the test can drive the page
      - run: npx tauri android build --debug --apk --target x86_64 --ci
      - name: Collect APK
        run: mkdir -p apk && find src-tauri/gen/android -name "*.apk" -exec cp {} apk/ \; && ls -la apk
      - name: Free disk space for the emulator (it needs ~7 GB)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift "$ANDROID_HOME/ndk"
          df -h / | tail -1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        # its own limit, so a stuck start still leaves time to publish what was logged
        timeout-minutes: 36
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          emulator-boot-timeout: 900
          api-level: 34
          # plain Android, without Google Play services: they often stall on the emulator, and Android
          # then closes every app connected to them (the app needs none of them)
          target: default
          arch: x86_64
          disable-animations: true
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: mkdir -p android-test && date -u +"emulator up %H:%M:%S" > android-test/started.txt && bash scripts/android_test.sh
      - name: Keep the results for the publishing job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: android-test, path: android-test, retention-days: 3, if-no-files-found: ignore }

  # Pushes the results to the android-test-results branch: a small job of its own, so the token that
  # can write never meets npm, cargo, Gradle or the app under test.
  publish-results:
    needs: emulator
    if: always() && needs.emulator.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with: { name: android-test, path: android-test }
      - name: Publish results
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p android-test && cd android-test
          rm -rf .git # (only the test's files go up: never a repository the tested code left behind)
          git init -q -b android-test-results
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Android test results for ${GITHUB_SHA}" || exit 0
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" android-test-results
