# Pull requests (also from forks): the core's tests and the speed check only. No secrets, a
# read-only token, and never `pull_request_target` (which would run a fork's code with this repo's
# rights). First-time contributors' runs also wait for the maintainer's approval (repository setting).
name: pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo test -p outline_core --locked
