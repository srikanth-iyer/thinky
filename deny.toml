# cargo deny check: licences every crate must have (all compatible with the AGPL-3.0), and where crates
# may come from, and known security advisories. Run: cargo deny check
# Only the systems the app ships for (Windows, Android): the Linux-only GTK crates the dev build pulls in
# never reach a user, and several are unmaintained.
[graph]
all-features = false
targets = ["x86_64-pc-windows-msvc", "aarch64-linux-android", "armv7-linux-androideabi", "i686-linux-android", "x86_64-linux-android"]

[advisories]
unmaintained = "all"
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
         "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0", "0BSD", "AGPL-3.0-only",
         "AGPL-3.0-or-later"]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
