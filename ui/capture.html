<!doctype html>
<html lang="en" data-skin="calm">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add to journal</title>
  <link rel="icon" href="data:,">
  <script src="boot.js"></script>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="skins.css">
  <link rel="stylesheet" href="app.css">
  <style>
    /* a launcher-style box (like Spotlight or Raycast): one wide line to type in, in the look's
       colours; the window has no title bar (Windows 11 rounds its corners and adds the shadow) */
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--surface); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; }
    .cap { display: flex; flex-direction: column; height: 100%; }
    .cap-in { flex: 1; min-height: 0; display: flex; align-items: flex-start; gap: 13px; padding: 15px 18px 12px 16px; }
    .cap-ic { flex: none; width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
    .cap-ic svg { width: 19px; height: 19px; stroke-width: 2.2; }
    textarea { flex: 1; min-width: 0; height: 30px; margin: 1px 0 0; padding: 0; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink);
      font-family: var(--font-body); font-size: 20px; line-height: 30px; overflow-y: auto; scrollbar-width: thin; }
    textarea::placeholder { color: var(--ink-faint); }
    textarea:focus-visible { outline: none; }
    .cap-foot { flex: none; display: flex; align-items: center; gap: 14px; padding: 6px 8px 6px 18px; border-top: 1px solid var(--line-soft); background: var(--surface-2);
      font-size: 12.5px; line-height: 20px; color: var(--ink-faint); user-select: none; -webkit-user-select: none; }
    .cap-where { margin-right: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cap-where b { font-weight: 500; color: var(--ink-soft); }
    .cap-where.ok { color: var(--accent); font-weight: 500; }
    .cap-where.err { color: var(--danger); white-space: normal; }
    .cap-keys { white-space: nowrap; }
    kbd { font-family: inherit; font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; margin: 0 3px 0 6px; background: var(--surface); color: var(--ink-soft); }
    .cap-x { flex: none; width: 26px; height: 26px; border: 0; border-radius: 7px; background: none; color: var(--ink-faint); cursor: pointer; display: grid; place-items: center; padding: 0; }
    .cap-x:hover { background: var(--line-soft); color: var(--ink); }
    .cap-x svg { width: 15px; height: 15px; }
  </style>
</head>
<body>
  <div class="cap">
    <div class="cap-in" data-tauri-drag-region>
      <span class="cap-ic" aria-hidden="true" data-tauri-drag-region></span>
      <textarea rows="1" aria-label="Note" placeholder="Add a note…" spellcheck="true"></textarea>
    </div>
    <div class="cap-foot" data-tauri-drag-region>
      <span class="cap-where" data-tauri-drag-region></span>
      <span class="cap-keys" data-tauri-drag-region><kbd>Enter</kbd>add<kbd>Shift+Enter</kbd>new line<kbd>Esc</kbd>close</span>
      <button class="cap-x" data-a="close" aria-label="Close" title="Close (Esc)"></button>
    </div>
  </div>
  <script type="module" src="capture.js"></script>
</body>
</html>
