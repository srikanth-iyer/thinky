# Builds the Windows app and the Android app on GitHub's machines and publishes them as a release
# ("Build N") here, where installed apps look for updates from Build 34 on. Build 34 is also published
# once more on the old downloads repo, srikanth-iyer/lean-outliner-releases, where Build 33 and older
# look (only while the RELEASES_TOKEN secret exists; delete it after Build 34). Runs on every push to main (a release, after the maintainer approves the
# signing) and to wip/** branches (a test build: never published, signed with throw-away keys).
#
# Secrets: none at repository level. Two environments, both allowed only for `main`:
#   release  (required reviewer: the maintainer)  ANDROID_KEY_PASSWORD, ANDROID_KEYSTORE_B64 (the locked
#            Android keystore, base64), UPDATE_KEY_PEM (the locked P-256 update key, PEM text)
#   publish  RELEASES_TOKEN (Build 34 only, then deleted: a fine-grained token, Contents read/write on
#            lean-outliner-releases only)
# Only the `sign` job (no build tools, nothing from npm/cargo/Gradle) sees the keys, writes them to the
# runner's temp folder and deletes them; only `release` sees the token and may write releases here. The jobs that build get a
# read-only token and no secrets. The keys were made once and must never be replaced: installed apps
# refuse an update signed with another key (CI stops instead).
#
# The update key's public half is ci/update-key.pub (not secret): the app is built with it, and
# `update-key` checks that the newest signed release checks out with it.
name: build

on:
  push:
    branches: [main, 'wip/**']
    paths-ignore: ['**.md', 'ci/baseline.json', 'dev/**', 'site/**', '.github/workflows/android-test.yml', '.github/workflows/pr.yml', 'scripts/android_test.sh', 'scripts/make_test_vault.py', 'scripts/ui_tap.py', 'scripts/android_cdp.mjs']
  workflow_dispatch:

# a newer push to a wip branch stops that branch's older run; main's runs (releases) always finish
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # where Build 33 and older look for updates; only read from, and written once more for Build 34
  OLD_RELEASES: srikanth-iyer/lean-outliner-releases

jobs:
  # The build number: one more than the newest release, here or on the old downloads repo ("Build N"). It is also
  # the app's version (0.1.N, scripts/ci_version.py), which installed apps compare with the newest release.
  number:
    runs-on: ubuntu-latest
    outputs:
      n: ${{ steps.n.outputs.n }}
    steps:
      - id: n
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # the newest build-N release here or on the old downloads repo (with asset $1, if given): "N repo"
          newest() {
            local best=0 from= r n
            for r in "$GITHUB_REPOSITORY" "$OLD_RELEASES"; do
              n=$(gh api "repos/$r/releases?per_page=100" | jq --arg a "$1" '[.[] | select($a == "" or any(.assets[]; .name == $a)) | .tag_name | select(test("^build-[0-9]+$")) | ltrimstr("build-") | tonumber] | max // 0')
              if [ "$n" -gt "$best" ]; then best=$n; from=$r; fi
            done
            echo "$best $from"
          }
          read -r last from <<< "$(newest '')"
          [ "$last" -ge 33 ] || { echo "::error::The newest release is build-$last; expected 33 or more. Not numbering from there."; exit 1; }
          echo "::notice title=Release number::newest release build-$last, this build $((last + 1))"
          echo "n=$((last + 1))" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p outline_core --locked
      - name: Speed check
        run: |
          cargo run --locked --release -p outline_core --example bench | tee bench.txt
          python3 scripts/ci_report.py bench bench.txt >> "$GITHUB_STEP_SUMMARY"

  # The public key the app is built with. main: ci/update-key.pub, checked against the newest signed
  # release (installed apps hold this key). wip: a throw-away key made here, for this run only (its
  # private half goes to `sign-wip` as a short-lived artifact; no real build trusts it).
  update-key:
    runs-on: ubuntu-latest
    outputs:
      pub: ${{ steps.key.outputs.pub }}
    env:
      OPENSSL: /usr/bin/openssl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { sparse-checkout: "scripts\nci", persist-credentials: false }
      - id: key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            mkdir -p wipkey
            "$OPENSSL" genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out wipkey/wip-update-key.pem
            echo "pub=$(python3 scripts/update_sig.py pub wipkey/wip-update-key.pem)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PUB=$(tr -d ' \r\n' < ci/update-key.pub)
          [ ${#PUB} = 88 ] || { echo "::error::ci/update-key.pub must hold the update key's public half (88 base64 characters)."; exit 1; }
          T="$RUNNER_TEMP/prev"; mkdir -p "$T"
          # the newest build-N release here or on the old downloads repo (with asset $1, if given): "N repo"
          newest() {
            local best=0 from= r n
            for r in "$GITHUB_REPOSITORY" "$OLD_RELEASES"; do
              n=$(gh api "repos/$r/releases?per_page=100" | jq --arg a "$1" '[.[] | select($a == "" or any(.assets[]; .name == $a)) | .tag_name | select(test("^build-[0-9]+$")) | ltrimstr("build-") | tonumber] | max // 0')
              if [ "$n" -gt "$best" ]; then best=$n; from=$r; fi
            done
            echo "$best $from"
          }
          read -r PREV FROM <<< "$(newest LeanOutliner-setup.exe.sig)"
          if [ "$PREV" -gt 0 ]; then
            gh release download "build-$PREV" -R "$FROM" -p LeanOutliner-setup.exe.sig -D "$T"
            python3 scripts/update_sig.py check "$PUB" "$T/LeanOutliner-setup.exe.sig" || {
              echo "::error::build-$PREV's signature doesn't check out with ci/update-key.pub: installed apps would refuse this build."; exit 1; }
          fi
          echo "pub=$PUB" >> "$GITHUB_OUTPUT"
      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: wip-update-key, path: wipkey/wip-update-key.pem, retention-days: 1 }

  # The build: no secrets, and only the update key's public half.
  windows:
    needs: [test, number, update-key]
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sums: ${{ steps.collect.outputs.sums }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # (no build cache on main: a release is built from the code alone, so nothing another job or run
      # put in the cache can end up in what is signed; wip builds keep it, for speed)
      - if: github.ref != 'refs/heads/main'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts # (only the Tauri command line, which needs no install scripts)
      - run: cargo fetch --locked # (the crates exactly as Cargo.lock lists them; a stale lock file stops the build)
      - id: version
        run: python scripts/ci_version.py
        env: { BUILD_NUMBER: '${{ needs.number.outputs.n }}' }
      - run: npx tauri build --bundles nsis
        env: { LEAN_UPDATE_KEY: '${{ needs.update-key.outputs.pub }}' }
      # Collected and uploaded straight after the build, with their SHA-256 as this job's output:
      # `sign`, `verify` and `release` check the files they get are exactly these.
      - name: Collect
        id: collect
        shell: bash
        run: |
          mkdir out
          cp target/release/bundle/nsis/*.exe out/LeanOutliner-setup.exe
          cp target/release/lean-outliner.exe out/LeanOutliner-portable.exe
          echo "sums=$(cd out && sha256sum LeanOutliner-setup.exe LeanOutliner-portable.exe | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: windows, path: out/* }
      # The native "Add to journal" box on a real Windows: how soon it's on screen after the
      # program starts, and that it works (a made-up notes folder in a fresh capbox-selftest folder
      # of its own; the box never takes the keyboard itself).
      - name: Capture box check
        shell: pwsh
        timeout-minutes: 3
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'capbox-selftest'
          $p = Start-Process -FilePath 'target\release\lean-outliner.exe' -ArgumentList @('--capture-box-selftest', $env:RUNNER_TEMP) -PassThru -Wait
          $lines = @(Get-Content (Join-Path $d 'result.txt') -ErrorAction SilentlyContinue)
          $lines | ForEach-Object { Write-Host $_ }
          $num = { param($k) $m = $lines | Select-String "^$k=(\d+)" | Select-Object -First 1; if ($m) { $m.Matches[0].Groups[1].Value } else { '?' } }
          $shown = & $num 'shown_ms'
          $where = & $num 'where_ms'
          $pass = @($lines | Where-Object { $_ -like 'PASS*' }).Count
          $fails = @($lines | Where-Object { $_ -like 'FAIL*' })
          echo "::notice title=Capture box::shown after $shown ms (where the note goes: $where ms); $pass checks passed, $($fails.Count) failed"
          foreach ($f in $fails) { echo "::error title=Capture box::$f" }
          if ($p.ExitCode -ne 0 -or $fails.Count -gt 0 -or $shown -eq '?') { exit 1 }
      # The shortcut key's helper (`--hotkey`, src-tauri/src/hotkey.rs) on a real Windows: a key
      # pressed opens the box (the ms in the notice), its memory and CPU, a changed key, a key another
      # program has, an older Start-menu shortcut's key moving to it (also with the real Start menu
      # and Explorer here), and Remove stopping it. A fresh hotkey-selftest folder of its own, with a
      # made-up notes folder and cache, and a Run entry of its own name.
      - name: Shortcut key check
        shell: pwsh
        timeout-minutes: 3
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'hotkey-selftest'
          $p = Start-Process -FilePath 'target\release\lean-outliner.exe' -ArgumentList @('--hotkey-selftest', $env:RUNNER_TEMP) -PassThru -Wait
          $lines = @(Get-Content (Join-Path $d 'result.txt') -Encoding utf8 -ErrorAction SilentlyContinue)
          $lines | ForEach-Object { Write-Host $_ }
          $num = { param($k) $m = $lines | Select-String "^$k=(\d+)" | Select-Object -First 1; if ($m) { $m.Matches[0].Groups[1].Value } else { '?' } }
          $box = & $num 'box_ms'
          $pass = @($lines | Where-Object { $_ -like 'PASS*' }).Count
          $fails = @($lines | Where-Object { $_ -like 'FAIL*' })
          echo "::notice title=Shortcut key::the box was on screen $box ms after the key (a new key: $(& $num 'box2_ms') ms; a key moved from the real Start menu: $(& $num 'start_menu_box_ms') ms); the helper: $(& $num 'helper_ws_kb') KB in RAM ($(& $num 'helper_after_box_ws_kb') KB after a box), $(& $num 'helper_private_kb') KB its own; saving a key took $(& $num 'on_ms') ms, moving one from the Start menu $(& $num 'start_menu_move_ms') ms; $pass checks passed, $($fails.Count) failed"
          $notes = @($lines | Where-Object { $_ -like 'NOTE*' }) -join ' | '
          if ($notes) { echo "::notice title=Shortcut key notes::$notes" }
          foreach ($f in $fails) { echo "::error title=Shortcut key::$f" }
          if ($p.ExitCode -ne 0 -or $fails.Count -gt 0 -or $box -eq '?') { exit 1 }
      - name: Keep the capture box pictures (wip builds; pushed by the capture-shots job)
        if: always() && startsWith(github.ref, 'refs/heads/wip/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: capture-box-shots
          path: |
            ${{ runner.temp }}/capbox-selftest/shots/*.png
            ${{ runner.temp }}/capbox-selftest/result.txt
          if-no-files-found: ignore
          retention-days: 3

  # The rename check, in a job of its own: it runs an installer downloaded from the downloads repo,
  # so it gets only the built installer (already uploaded, its SHA-256 recorded by `windows`), no
  # cache, and nothing it does reaches what is signed. A release waits for it.
  rename-check:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: windows, path: built }
      # The rename (Oct 29, 2026: "Lean Outliner" became thinky; src-tauri/windows/hooks.nsh): the
      # real Build 31 installer, then this build's installer as an update (/S /UPDATE: the one-click
      # update's way, silent) must leave ONE app, thinky, in its own folder, with the old one's
      # shortcuts, links and shortcut key moved over; then uninstalling thinky must leave nothing.
      # The runner's own user and folders (never run on your own computer).
      - name: Rename check
        shell: pwsh
        timeout-minutes: 10
        run: |
          $fails = [System.Collections.Generic.List[string]]::new()
          function Fail($m) { echo "::error title=Rename check::$m"; $fails.Add($m) }
          $sh = New-Object -ComObject WScript.Shell
          $uninst = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $linkKey = 'HKCU:\Software\Classes\leanoutliner\shell\open\command'
          $oldDir = Join-Path $env:LOCALAPPDATA 'Lean Outliner'
          $newDir = Join-Path $env:LOCALAPPDATA 'thinky'
          $sm = [Environment]::GetFolderPath('Programs')
          $desk = [Environment]::GetFolderPath('Desktop')
          $value = { param($k, $n) (Get-ItemProperty -Path $k -Name $n -ErrorAction SilentlyContinue).$n }
          $ours = { @(Get-ChildItem $sm, $desk -Recurse -Filter *.lnk -ErrorAction SilentlyContinue | Where-Object { $_.BaseName -in @('thinky', 'Lean Outliner') }) }
          # 1. Build 31, as installed: installed, its links and shortcut key pointing at it
          $old = Join-Path $env:RUNNER_TEMP 'build31-setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/srikanth-iyer/lean-outliner-releases/releases/download/build-31/LeanOutliner-setup.exe' -OutFile $old
          # only the genuine Build 31 runs here: its SHA-256, as its signature file (checked with
          # ci/update-key.pub, Oct 31, 2026) says; anything else in its place is never started
          $want = '3eb3fd283fd47cb2c854cd431c482d9df89160f48de813219a51a71dd488cc11'
          $got = (Get-FileHash $old -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { Fail "the Build 31 installer on the downloads repo isn't the genuine one (SHA-256 $got): not run"; exit 1 }
          Start-Process -FilePath $old -ArgumentList '/S' -Wait
          if (-not (Test-Path "$oldDir\lean-outliner.exe") -or -not (Test-Path "$uninst\Lean Outliner")) { Fail 'Build 31 did not install (nothing to check the rename against)'; exit 1 }
          $hadDesk = Test-Path "$desk\Lean Outliner.lnk"
          Write-Host "Build 31 installed: $oldDir; shortcuts: $((& $ours | ForEach-Object FullName) -join ', ')"
          New-Item -Force -Path $linkKey | Out-Null
          Set-ItemProperty -Path $linkKey -Name '(default)' -Value "`"$oldDir\lean-outliner.exe`" `"%1`""
          Set-ItemProperty -Path $runKey -Name 'Lean Outliner shortcut key' -Value "`"$oldDir\lean-outliner.exe`" --hotkey"
          # the app's data (named by the hidden identifier) must come through untouched
          $marks = @((Join-Path $env:LOCALAPPDATA 'com.srikanth.leanoutliner\ci-marker.txt'), (Join-Path $env:APPDATA 'com.srikanth.leanoutliner\ci-marker.txt'))
          foreach ($m in $marks) { New-Item -Force -ItemType File -Path $m -Value 'app data' | Out-Null }
          # the old app open, as when Update now is pressed (it closes itself; here the installer must wait, then close it)
          $oldApp = Start-Process -FilePath "$oldDir\lean-outliner.exe" -PassThru
          Start-Sleep -Seconds 4
          # 2. this build over it, the way the one-click update starts it: passive, restart, update
          $new = (Resolve-Path 'built\LeanOutliner-setup.exe').Path
          Write-Host "Installing $new /P /R /UPDATE (old app open: $(-not $oldApp.HasExited))"
          # (not Start-Process -Wait: in PowerShell 7 that also waits for the app /R starts, which never ends)
          $p = Start-Process -FilePath $new -ArgumentList '/P', '/R', '/UPDATE' -PassThru
          if (-not $p.WaitForExit(240000)) {
            $wins = Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { "$($_.ProcessName): $($_.MainWindowTitle)" }
            Fail "the thinky installer was still running after 4 minutes; windows open: $($wins -join ' | ')"; exit 1
          }
          if ($p.ExitCode -ne 0) { Fail "the thinky installer stopped with code $($p.ExitCode)" }
          $byPath = { param($dir) @(Get-CimInstance Win32_Process -Filter "Name='lean-outliner.exe'" | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith($dir, 'OrdinalIgnoreCase') }) }
          $restarted = $null
          for ($i = 0; $i -lt 40 -and -not $restarted; $i++) { $restarted = (& $byPath $newDir) | Select-Object -First 1; if (-not $restarted) { Start-Sleep -Milliseconds 500 } }
          if (-not $restarted) { Fail 'after the update, thinky wasn''t started again from its new folder (/R)' }
          if ((& $byPath $oldDir).Count) { Fail 'a program from the old Lean Outliner folder is still running' }
          foreach ($m in $marks) { if (-not (Test-Path $m)) { Fail "the app data was touched: $m is gone" } }
          (& $byPath $newDir) | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2
          if (Test-Path "$uninst\Lean Outliner") { Fail 'the old "Lean Outliner" entry is still in Apps & features' }
          if (Test-Path $oldDir) { Fail "the old folder is still there: $oldDir ($((Get-ChildItem $oldDir -Force | ForEach-Object Name) -join ', '))" }
          if (Get-ChildItem HKCU:\Software -ErrorAction SilentlyContinue | Where-Object { Test-Path (Join-Path $_.PSPath 'Lean Outliner') }) { Fail 'Tauri''s note of the old install folder (HKCU\Software\<maker>\Lean Outliner) is still there' }
          if ((& $value "$uninst\thinky" 'DisplayName') -ne 'thinky') { Fail 'no "thinky" entry in Apps & features' }
          if ((& $value "$uninst\thinky" 'UninstallString') -ne "`"$newDir\uninstall.exe`"") { Fail "thinky's uninstaller isn't in $newDir" }
          if (-not (Test-Path "$newDir\lean-outliner.exe")) { Fail "no $newDir\lean-outliner.exe" }
          $start = @(Get-ChildItem $sm -Recurse -Filter *.lnk -ErrorAction SilentlyContinue | Where-Object { $_.BaseName -in @('thinky', 'Lean Outliner') })
          if ($start.Count -ne 1 -or $start[0].BaseName -ne 'thinky') { Fail "the Start menu should have one shortcut, thinky; it has: $(($start | ForEach-Object Name) -join ', ')" }
          elseif ($sh.CreateShortcut($start[0].FullName).TargetPath -ne "$newDir\lean-outliner.exe") { Fail "the Start-menu shortcut points at $($sh.CreateShortcut($start[0].FullName).TargetPath)" }
          if ($hadDesk -and -not (Test-Path "$desk\thinky.lnk")) { Fail 'the desktop shortcut wasn''t moved over to thinky' }
          if (Test-Path "$desk\Lean Outliner.lnk") { Fail 'the old desktop shortcut is still there' }
          if ((& $value $linkKey '(default)') -ne "`"$newDir\lean-outliner.exe`" `"%1`"") { Fail "leanoutliner:// links open $(& $value $linkKey '(default)')" }
          if ((& $value $runKey 'Lean Outliner shortcut key') -ne "`"$newDir\lean-outliner.exe`" --hotkey") { Fail "the shortcut key's Run entry is $(& $value $runKey 'Lean Outliner shortcut key')" }
          # 3. uninstalling thinky (its uninstaller copies itself away and returns at once: wait for it)
          Start-Process -FilePath "$newDir\uninstall.exe" -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and ((Test-Path "$newDir\lean-outliner.exe") -or (Test-Path "$uninst\thinky")); $i++) { Start-Sleep -Milliseconds 500 }
          Start-Sleep -Seconds 2
          if (Test-Path "$uninst\thinky") { Fail 'after uninstalling, thinky is still in Apps & features' }
          if (Test-Path $newDir) { Fail "after uninstalling, $newDir is still there ($((Get-ChildItem $newDir -Force | ForEach-Object Name) -join ', '))" }
          $left = & $ours
          if ($left.Count) { Fail "after uninstalling, shortcuts are left: $(($left | ForEach-Object FullName) -join ', ')" }
          if (Test-Path 'HKCU:\Software\Classes\leanoutliner') { Fail 'after uninstalling, leanoutliner:// links still point somewhere' }
          if (& $value $runKey 'Lean Outliner shortcut key') { Fail 'after uninstalling, the shortcut key still starts with Windows' }
          foreach ($m in $marks) { if (-not (Test-Path $m)) { Fail "uninstalling removed the app data: $m" } }
          if ($fails.Count) { exit 1 }
          echo "::notice title=Rename check::Build 31 (open) → thinky as a one-click update (/P /R /UPDATE): one app in $newDir, restarted, the app data kept, the old entry, folder and shortcuts gone, the Start-menu$(if ($hadDesk) { ' and desktop' }) shortcut, links and shortcut key moved over; uninstalling leaves nothing"

  # Dependency checks (deny.toml: known security advisories, licences, where crates come from). It
  # reports and doesn't hold the build back: a new advisory shows here as a failed check to look at.
  deny:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with: { command: check advisories licenses bans sources }

  # A wip build's capture box pictures (from the Windows job's check), kept on the capture-box-shots
  # branch. A job of its own: the build job's token can only read.
  capture-shots:
    needs: windows
    if: always() && startsWith(github.ref, 'refs/heads/wip/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with: { name: capture-box-shots, path: got }
      - name: Push them
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          [ -d got ] || exit 0
          mkdir repo && cd repo
          cp ../got/shots/*.png . 2>/dev/null || true
          cp ../got/result.txt . 2>/dev/null || true
          [ -n "$(ls)" ] || exit 0
          git init -q -b capture-box-shots
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Capture box pictures for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" capture-box-shots

  # The APK, built unsigned: no secrets here (npm, cargo and Gradle run in this job).
  android:
    needs: [test, number]
    runs-on: ubuntu-latest
    outputs:
      sums: ${{ steps.collect.outputs.sums }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '17' }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: 'aarch64-linux-android' }
      # (no build cache on main: a release is built from the code alone, so nothing another job or run
      # put in the cache can end up in what is signed; wip builds keep it, for speed)
      - if: github.ref != 'refs/heads/main'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts # (only the Tauri command line, which needs no install scripts)
      - run: cargo fetch --locked # (the crates exactly as Cargo.lock lists them; a stale lock file stops the build)
      - run: python3 scripts/ci_version.py
        env: { BUILD_NUMBER: '${{ needs.number.outputs.n }}' }
      - name: Use the runner's Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: npx tauri android init --ci
      - run: python3 scripts/android_overlay.py
      - run: npx tauri android build --apk --target aarch64 --ci
      - name: Collect the unsigned APK
        id: collect
        run: |
          cp "$(find src-tauri/gen/android -name '*release-unsigned.apk' | head -1)" LeanOutliner-unsigned.apk
          echo "sums=$(sha256sum LeanOutliner-unsigned.apk | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: android-unsigned, path: LeanOutliner-unsigned.apk, retention-days: 5 }

  # The newest release's APK certificate, read here, in a job with no secrets (main only): `sign`
  # then only compares it with the new APK's, never opening a downloaded file while it holds the keys.
  prev-cert:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      cert: ${{ steps.cert.outputs.cert }}
      build: ${{ steps.cert.outputs.build }}
    steps:
      - id: cert
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          # the newest build-N release here or on the old downloads repo (with asset $1, if given): "N repo"
          newest() {
            local best=0 from= r n
            for r in "$GITHUB_REPOSITORY" "$OLD_RELEASES"; do
              n=$(gh api "repos/$r/releases?per_page=100" | jq --arg a "$1" '[.[] | select($a == "" or any(.assets[]; .name == $a)) | .tag_name | select(test("^build-[0-9]+$")) | ltrimstr("build-") | tonumber] | max // 0')
              if [ "$n" -gt "$best" ]; then best=$n; from=$r; fi
            done
            echo "$best $from"
          }
          read -r PREV FROM <<< "$(newest LeanOutliner.apk)"
          [ "$PREV" -gt 0 ] || { echo "::error::No release here or on $OLD_RELEASES has an APK to compare the signing certificate with."; exit 1; }
          gh release download "build-$PREV" -R "$FROM" -p LeanOutliner.apk -D "$RUNNER_TEMP/prev"
          OLD=$({ "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/prev/LeanOutliner.apk" || true; } | awk -F': ' '/certificate SHA-256 digest/ { print $NF }' | tr -d ' \r' | sort -u | grep -E '^[0-9a-f]{64}$' | tr '\n' ' ' | sed 's/ $//' || true)
          [ -n "$OLD" ] || { echo "::error::build-$PREV's APK certificate couldn't be read."; exit 1; }
          echo "cert=$OLD" >> "$GITHUB_OUTPUT"
          echo "build=$PREV" >> "$GITHUB_OUTPUT"

  # main only: sign the installer and the APK with the real keys, on a machine of its own that gets
  # only the scripts, the version rule and the two built files (no build tools run here). Waits for
  # the maintainer's approval (environment `release`). The keys are written from secrets into the
  # runner's temp folder and deleted at the end; they are never outputs, artifacts or log lines.
  sign:
    needs: [number, update-key, windows, android, prev-cert]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    outputs:
      sums: ${{ steps.signed.outputs.sums }}
    env:
      OPENSSL: /usr/bin/openssl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /src-tauri/tauri.conf.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: windows, path: built }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: android-unsigned, path: unsigned }
      - name: The built files are the ones their jobs made
        env: { WIN: '${{ needs.windows.outputs.sums }}', APK: '${{ needs.android.outputs.sums }}' }
        run: |
          set -euo pipefail
          [ -n "$WIN" ] && [ -n "$APK" ] || { echo "::error::A build job didn't say what it made."; exit 1; }
          (cd built && printf '%s' "$WIN" | base64 -d | sha256sum -c -)
          (cd unsigned && printf '%s' "$APK" | base64 -d | sha256sum -c -)
      - name: Sign the installer
        env:
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          UPDATE_KEY_PEM: ${{ secrets.UPDATE_KEY_PEM }}
          PUB: ${{ needs.update-key.outputs.pub }}
          N: ${{ needs.number.outputs.n }}
          BUILT: ${{ needs.windows.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/update-key.pem"; trap 'rm -f "$KEY" "$RUNNER_TEMP/other.pem"' EXIT
          [ -n "$KEY_PASS" ] && [ -n "$UPDATE_KEY_PEM" ] || { echo "::error::The release environment's secrets are missing. Never make a new key: installed apps would refuse every update."; exit 1; }
          printf '%s\n' "$UPDATE_KEY_PEM" > "$KEY"
          [ "$(python3 scripts/update_sig.py pub "$KEY")" = "$PUB" ] || { echo "::error::The signing key isn't the one the app is built with (ci/update-key.pub)."; exit 1; }
          VERSION=$(python3 scripts/update_sig.py version "$N")
          [ "$VERSION" = "$BUILT" ] || { echo "::error::The build says it is version '$BUILT', but build $N is $VERSION: not signed."; exit 1; }
          mkdir -p sig checks
          python3 scripts/update_sig.py sign "$KEY" built/LeanOutliner-setup.exe sig/LeanOutliner-setup.exe.sig "$VERSION"
          "$OPENSSL" genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$RUNNER_TEMP/other.pem"
          KEY_PASS= python3 scripts/update_sig.py sign "$RUNNER_TEMP/other.pem" built/LeanOutliner-setup.exe checks/other-key.sig "$VERSION"
      - name: Sign the APK
        env:
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          OLD: ${{ needs.prev-cert.outputs.cert }}
          PREV: ${{ needs.prev-cert.outputs.build }}
        run: |
          set -euo pipefail
          umask 077
          KS="$RUNNER_TEMP/release.keystore"; trap 'rm -f "$KS"' EXIT
          [ -n "$KEY_PASS" ] && [ -n "$KEYSTORE_B64" ] || { echo "::error::The release environment's secrets are missing. Never make a new keystore: phones would refuse every update."; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          export PASS="$KEY_PASS"; unset KEY_PASS
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 unsigned/LeanOutliner-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias leanoutliner --ks-pass env:PASS --out LeanOutliner.apk aligned.apk
          "$BT/apksigner" verify LeanOutliner.apk
          cert() { { "$BT/apksigner" verify --print-certs "$1" || true; } | awk -F': ' '/certificate SHA-256 digest/ { print $NF }' | tr -d ' \r' | sort -u | grep -E '^[0-9a-f]{64}$' | tr '\n' ' ' | sed 's/ $//' || true; }
          NEW=$(cert LeanOutliner.apk)
          [ -n "$NEW" ] || { echo "::error::The new APK's signing certificate couldn't be read."; exit 1; }
          [ "$OLD" = "$NEW" ] || { echo "::error::This APK isn't signed like build-$PREV's (certificate $NEW, build-$PREV: $OLD): phones would refuse it."; exit 1; }
          echo "::notice title=APK signed::with the release key (certificate SHA-256 $NEW)"
      - id: signed
        run: echo "sums=$(sha256sum LeanOutliner.apk sig/LeanOutliner-setup.exe.sig | sed 's| sig/| |' | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: update-signature, path: sig/LeanOutliner-setup.exe.sig }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: update-checks, path: checks/other-key.sig, retention-days: 5 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: android, path: LeanOutliner.apk }

  # wip only: the same signing with this run's throw-away keys (no secrets), so `verify` and the
  # size check still run. A phone or computer with the real app refuses these files.
  sign-wip:
    needs: [number, update-key, windows, android]
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      OPENSSL: /usr/bin/openssl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /src-tauri/tauri.conf.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: windows, path: built }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: android-unsigned, path: unsigned }
      - name: The built files are the ones their jobs made
        env: { WIN: '${{ needs.windows.outputs.sums }}', APK: '${{ needs.android.outputs.sums }}' }
        run: |
          set -euo pipefail
          [ -n "$WIN" ] && [ -n "$APK" ] || { echo "::error::A build job didn't say what it made."; exit 1; }
          (cd built && printf '%s' "$WIN" | base64 -d | sha256sum -c -)
          (cd unsigned && printf '%s' "$APK" | base64 -d | sha256sum -c -)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: wip-update-key, path: wipkey }
      - name: Sign with throw-away keys
        env:
          PUB: ${{ needs.update-key.outputs.pub }}
          N: ${{ needs.number.outputs.n }}
          BUILT: ${{ needs.windows.outputs.version }}
        run: |
          set -euo pipefail
          KEY=wipkey/wip-update-key.pem
          [ "$(python3 scripts/update_sig.py pub "$KEY")" = "$PUB" ] || { echo "::error::The wip key isn't the one the app is built with."; exit 1; }
          VERSION=$(python3 scripts/update_sig.py version "$N")
          [ "$VERSION" = "$BUILT" ] || { echo "::error::The build says it is version '$BUILT', but build $N is $VERSION."; exit 1; }
          mkdir -p sig checks
          python3 scripts/update_sig.py sign "$KEY" built/LeanOutliner-setup.exe sig/LeanOutliner-setup.exe.sig "$VERSION"
          "$OPENSSL" genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$RUNNER_TEMP/other.pem"
          python3 scripts/update_sig.py sign "$RUNNER_TEMP/other.pem" built/LeanOutliner-setup.exe checks/other-key.sig "$VERSION"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 unsigned/LeanOutliner-unsigned.apk aligned.apk
          export PASS="$(openssl rand -hex 16)"; KS="$RUNNER_TEMP/throwaway.keystore"
          keytool -genkeypair -noprompt -keystore "$KS" -storetype PKCS12 -alias leanoutliner -keyalg RSA -keysize 2048 -validity 10000 -storepass:env PASS -dname "CN=thinky (wip test build)"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias leanoutliner --ks-pass env:PASS --out LeanOutliner.apk aligned.apk
          "$BT/apksigner" verify LeanOutliner.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: update-signature, path: sig/LeanOutliner-setup.exe.sig }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: update-checks, path: checks/other-key.sig, retention-days: 5 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: android, path: LeanOutliner.apk }

  # The shipped program must accept its signed installer and refuse a changed one, another build
  # number, an edited version and another key: the check an installed app makes before it updates.
  verify:
    needs: [number, windows, sign, sign-wip]
    if: always() && needs.windows.result == 'success' && (needs.sign.result == 'success' || needs.sign-wip.result == 'success')
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: windows, path: built }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: update-signature, path: built }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: update-checks, path: checks }
      - name: The installer is the one the Windows job made
        shell: bash
        env: { WIN: '${{ needs.windows.outputs.sums }}' }
        run: (cd built && printf '%s' "$WIN" | base64 -d | sha256sum -c -)
      - name: The app accepts its signed installer, and only that
        shell: bash
        env:
          N: ${{ needs.number.outputs.n }}
        run: |
          set -euo pipefail
          SETUP=built/LeanOutliner-setup.exe; SIG=built/LeanOutliner-setup.exe.sig
          T="$RUNNER_TEMP/verify"; mkdir -p "$T"
          python -c "import sys; b = bytearray(open(sys.argv[1], 'rb').read()); b[len(b) // 2] ^= 1; open(sys.argv[2], 'wb').write(b)" "$SETUP" "$T/changed.exe"
          python -c "import json, sys; d = json.load(open(sys.argv[1])); v = d['version'].split('.'); v[-1] = str(int(v[-1]) + 1); d['version'] = '.'.join(v); json.dump(d, open(sys.argv[2], 'w'))" "$SIG" "$T/edited.sig"
          bad=0 seen=""
          expect() { # expect <genuine|refused> <what> <installer> <signature file> <build number>
            local want=$1 what=$2 code=0 said; shift 2
            built/LeanOutliner-portable.exe --verify-update "$@" > "$T/said.txt" 2>&1 || code=$?
            said=$(tr -d '\r' < "$T/said.txt")
            if { [ "$want" = genuine ] && [ $code = 0 ]; } || { [ "$want" = refused ] && [ $code = 1 ]; }; then
              echo "ok: $what -> $said"; seen="$seen | $what: $said"
            else
              echo "::error::Update check: $what should be $want, but the app said (exit $code): $said"; bad=1
            fi
          }
          expect genuine "the signed installer" "$SETUP" "$SIG" "$N"
          expect refused "a changed installer" "$T/changed.exe" "$SIG" "$N"
          expect refused "the installer offered as another build" "$SETUP" "$SIG" "$((N + 1))"
          expect refused "a signature file with its version edited" "$SETUP" "$T/edited.sig" "$((N + 1))"
          expect refused "an installer signed with another key" "$SETUP" checks/other-key.sig "$N"
          # (the app's own words, readable from the job's annotations)
          [ $bad = 1 ] || echo "::notice title=Update check of build $N::${seen# | }"
          exit $bad

  # Sizes, on every build (no secrets).
  sizes:
    needs: [verify]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { sparse-checkout: "scripts\nci", persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: android, path: dist }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: windows, path: dist }
      - run: python3 scripts/ci_report.py sizes dist | tee -a "$GITHUB_STEP_SUMMARY"

  # main only: publish the release here (installed apps from Build 34 on look here), and, while the
  # RELEASES_TOKEN secret exists (Build 34 only), once more on the old downloads repo, where Build 33
  # and older look. Environment `publish`, allowed only for main.
  release:
    needs: [number, windows, sign, verify, rename-check]
    if: github.ref == 'refs/heads/main' && needs.sign.result == 'success' && needs.verify.result == 'success' && needs.rename-check.result == 'success'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { sparse-checkout: "scripts\nci", persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: android, path: dist }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: windows, path: dist }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: update-signature, path: dist }
      - name: The files are the ones built and signed
        env: { WIN: '${{ needs.windows.outputs.sums }}', SIGNED: '${{ needs.sign.outputs.sums }}' }
        run: |
          set -euo pipefail
          [ -n "$WIN" ] && [ -n "$SIGNED" ] || { echo "::error::A job didn't say what it made."; exit 1; }
          cd dist && { printf '%s' "$WIN" | base64 -d; printf '%s' "$SIGNED" | base64 -d; } | sha256sum -c -
          [ "$(ls | wc -l)" = 4 ] || { echo "::error::Unexpected files to publish: $(ls)"; exit 1; }
      - name: Release notes
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 scripts/ci_report.py sizes dist > sizes.md
          # the change description, without the commit's sign-off lines and test tags
          printf '%s\n' "$MSG" | grep -v -E '^(Co-Authored-By|Claude-Session|Signed-off-by):' | sed -e 's/ *\[android-test\]//g' > notes.md
          printf '\n' >> notes.md
          cat sizes.md >> notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: build-${{ needs.number.outputs.n }}
          name: Build ${{ needs.number.outputs.n }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: dist/*
          make_latest: true
      - id: old
        name: Also on the old downloads repo? (only while RELEASES_TOKEN exists)
        env: { HAS: "${{ secrets.RELEASES_TOKEN != '' }}" }
        run: echo "too=$HAS" >> "$GITHUB_OUTPUT"
      - if: steps.old.outputs.too == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          repository: srikanth-iyer/lean-outliner-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: build-${{ needs.number.outputs.n }}
          name: Build ${{ needs.number.outputs.n }}
          body_path: notes.md
          files: dist/*
          make_latest: true
