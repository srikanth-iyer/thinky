# Pull requests (also from forks): the core's and the dev server's tests and Clippy only. No secrets, a
# read-only token, and never `pull_request_target` (which would run a fork's code with this repo's
# rights). First-time contributors' runs also wait for the maintainer's approval (repository setting).
name: pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # the crates that build on Ubuntu (src-tauri needs the Windows or Android system's own parts)
      - run: cargo test -p outline_core -p devserver --locked
      # Clippy: its correctness and suspicious lints stop the check; the rest only show (review A4)
      - run: cargo clippy -p outline_core -p devserver --all-targets --locked -- -D clippy::correctness -D clippy::suspicious
