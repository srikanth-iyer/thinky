<!doctype html>
<html lang="en" data-skin="calm">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Lean Outliner</title>
  <link rel="icon" href="data:,">
  <script src="boot.js"></script>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="skins.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <nav id="histbar" aria-label="Back, forward and tabs"></nav>
    <aside id="side" aria-label="Navigation"></aside>
    <div id="col">
      <header id="topbar"></header>
      <div id="findbar" hidden></div>
      <main id="main" class="pane act"><div class="view"><p class="note">Opening your notes…</p></div></main>
      <section id="main2" class="pane" aria-label="The page on the right" hidden></section>
    </div>
  </div>
  <div id="toolbar" hidden></div>
  <div id="search" hidden>
    <div class="search-box" role="dialog" aria-label="Search">
      <input type="search" placeholder="Search pages and notes" aria-label="Search">
      <ul class="results" role="listbox"></ul>
      <div class="sb-foot"></div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
